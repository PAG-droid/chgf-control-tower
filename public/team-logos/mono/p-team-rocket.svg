<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team P, Team Rocket">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#16232B" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#F1EBE0"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- fins, 45 degrees -->
  <g fill="#16232B">
    <path d="M104 128L72 172h32Z"/>
    <path d="M152 128l32 44h-32Z"/>
  </g>

  <!-- body -->
  <rect x="104" y="76" width="48" height="72" fill="#F1EBE0" stroke="#16232B" stroke-width="14"/>

  <!-- nose, a caret -->
  <path d="M128 36l26 40h-52Z" fill="#16232B"/>

  <!-- porthole, a cursor block -->
  <rect x="118" y="96" width="20" height="26" fill="#16232B"/>

  <!-- exhaust -->
  <g stroke="#16232B" stroke-width="9" stroke-linecap="round">
    <path d="M112 188h32"/>
    <path d="M118 206h20"/>
    <path d="M125 222h6"/>
  </g>
</svg>
