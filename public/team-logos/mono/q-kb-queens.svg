<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team Q, KB Queens">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#16232B" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#F1EBE0"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- crown points, keycaps stepped on the grid -->
  <g fill="#16232B">
    <rect x="48" y="136" width="24" height="40"/>
    <rect x="80" y="112" width="24" height="64"/>
    <rect x="112" y="80" width="32" height="96"/>
    <rect x="152" y="112" width="24" height="64"/>
    <rect x="184" y="136" width="24" height="40"/>
  </g>

  <text x="128" y="116" text-anchor="middle" fill="#F1EBE0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" font-weight="700">kb</text>

  <!-- base -->
  <rect x="48" y="176" width="160" height="24" fill="#16232B"/>

  <!-- caret -->
  <rect x="96" y="212" width="64" height="10" fill="#16232B"/>
</svg>
