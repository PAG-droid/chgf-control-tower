<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team O, Bleeding Edge">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#16232B" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#F1EBE0"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- trailing rules -->
  <g stroke="#16232B" stroke-opacity="0.4" stroke-width="9" stroke-linecap="round">
    <path d="M56 152L104 104"/>
    <path d="M48 120L80 88"/>
  </g>

  <!-- the edge -->
  <path d="M48 208L200 56" stroke="#16232B" stroke-width="24" stroke-linecap="butt"/>

  <!-- leading tip -->
  <rect x="196" y="32" width="28" height="28" fill="#16232B" transform="rotate(45 210 46)"/>

  <!-- bleeding off -->
  <g fill="#16232B">
    <rect x="142" y="154" width="20" height="20" transform="rotate(45 152 164)"/>
    <rect x="179" y="123" width="14" height="14" transform="rotate(45 186 130)"/>
    <rect x="207" y="99" width="10" height="10" transform="rotate(45 212 104)"/>
  </g>
</svg>
