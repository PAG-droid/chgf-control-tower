<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team M, Vector Borne">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#16232B" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#F1EBE0"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- the hops, 45 degrees, springing from the circles' tangent points -->
  <g fill="none" stroke="#16232B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 120L88 94l26 26"/>
    <path d="M142 120L168 94l26 26"/>
  </g>

  <!-- hosts -->
  <g fill="#16232B">
    <circle cx="48" cy="134" r="20"/>
    <circle cx="128" cy="134" r="20"/>
    <circle cx="208" cy="134" r="20"/>
  </g>

  <!-- ground -->
  <path d="M24 158H232" stroke="#16232B" stroke-width="9" stroke-linecap="round"/>

  <!-- what is carried -->
  <g fill="#16232B">
    <rect x="78" y="84" width="20" height="20" transform="rotate(45 88 94)"/>
    <rect x="158" y="84" width="20" height="20" transform="rotate(45 168 94)"/>
  </g>
</svg>
