<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Journey, terminal-built direction">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#16232B" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#F1EBE0"/>
  <rect width="256" height="256" fill="url(#grid)"/>

  <!-- prompt -->
  <path d="M28 190l14 14-14 14" fill="none" stroke="#E4572E" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the route, as box-drawing rules on the grid -->
  <path d="M56 204H96V164H136V124H176V84" fill="none" stroke="#16232B" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- terminus -->
  <rect x="164" y="40" width="24" height="32" fill="#E4572E"/>
</svg>
