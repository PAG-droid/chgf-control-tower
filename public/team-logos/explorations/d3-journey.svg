<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Journey, type-led direction">
  <rect width="256" height="256" fill="#F1EBE0"/>

  <!-- rising trail -->
  <line x1="18" y1="216" x2="238" y2="164" stroke="#E4572E" stroke-width="5"
        stroke-dasharray="12 9" stroke-linecap="round"/>

  <g font-family="Arial Black, Arial Bold, Helvetica, sans-serif" font-size="38"
     font-weight="900" text-anchor="middle" fill="#16232B">
    <text x="32" y="200">J</text>
    <text x="92" y="184">U</text>
    <text x="122" y="176">R</text>
    <text x="152" y="168">N</text>
    <text x="182" y="160">E</text>
    <text x="212" y="152" fill="#E4572E">Y</text>
  </g>

  <!-- the O is a waypoint -->
  <circle cx="62" cy="179" r="13" fill="none" stroke="#16232B" stroke-width="9"/>
  <circle cx="62" cy="179" r="4" fill="#16232B"/>
</svg>
