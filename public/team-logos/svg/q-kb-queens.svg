<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team Q, KB Queens">
  <rect width="256" height="256" fill="#FAF7F0"/>

  <!-- crown points, made of keycaps -->
  <g stroke="#35194F" stroke-width="4.5" stroke-linejoin="round">
    <g fill="#5B2E91">
      <rect x="50" y="126" width="30" height="52" rx="7"/>
      <rect x="86" y="104" width="30" height="74" rx="7"/>
      <rect x="158" y="104" width="30" height="74" rx="7"/>
      <rect x="194" y="126" width="30" height="52" rx="7"/>
      <rect x="120" y="82" width="36" height="96" rx="8"/>
    </g>
    <g fill="#7A47B8" stroke="none">
      <rect x="55" y="131" width="20" height="13" rx="4"/>
      <rect x="91" y="109" width="20" height="13" rx="4"/>
      <rect x="163" y="109" width="20" height="13" rx="4"/>
      <rect x="199" y="131" width="20" height="13" rx="4"/>
      <rect x="126" y="87" width="24" height="14" rx="4"/>
    </g>
  </g>

  <text x="138" y="150" text-anchor="middle" fill="#FBF6EC"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" font-weight="700">kb</text>

  <!-- crown base -->
  <rect x="46" y="170" width="182" height="32" rx="9" fill="#E8B33C" stroke="#35194F" stroke-width="5"/>

