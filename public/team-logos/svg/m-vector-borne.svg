<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Team M, Vector Borne">
  <rect width="256" height="256" fill="#FAF7F0"/>

  <!-- wings, translucent -->
  <g stroke="#17B6D6" stroke-width="3.5" stroke-linejoin="round">
    <path fill="#17B6D6" fill-opacity="0.28" d="M134 126Q70 96 44 58Q94 82 140 112Z"/>
    <path fill="#17B6D6" fill-opacity="0.28" d="M136 124Q114 62 124 30Q150 74 150 108Z"/>
  </g>

  <!-- legs -->
  <g fill="none" stroke="#26307A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 162L70 180 48 168"/>
    <path d="M114 148L94 192l12 24"/>
    <path d="M126 136l16 44 30 14"/>
    <path d="M142 118l34 10 12 26"/>
  </g>

  <!-- abdomen and thorax -->
  <line x1="66" y1="196" x2="134" y2="128" stroke="#26307A" stroke-width="15" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="152" cy="110" r="13" fill="#26307A"/>
  <!-- proboscis -->
  <line x1="160" y1="102" x2="200" y2="84" stroke="#26307A" stroke-width="5" stroke-linecap="round"/>
  <!-- antennae -->
  <g fill="none" stroke="#26307A" stroke-width="3.5" stroke-linecap="round">
    <path d="M158 100l20-26"/>
    <path d="M148 98l4-30"/>
  </g>

  <!-- bezier handles on the wing tips -->
  <g stroke="#17B6D6" stroke-width="2.5" stroke-dasharray="6 5">
    <line x1="44" y1="58" x2="22" y2="34"/>
    <line x1="124" y1="30" x2="150" y2="16"/>
  </g>
  <g fill="#FAF7F0" stroke="#17B6D6" stroke-width="2.5">
    <circle cx="22" cy="34" r="5"/>
    <circle cx="150" cy="16" r="5"/>
  </g>

  <!-- anchor points -->
  <g fill="#FF6B4A">
    <rect x="61" y="191" width="10" height="10"/>
    <rect x="129" y="123" width="10" height="10"/>
    <rect x="147" y="105" width="10" height="10"/>
    <rect x="39" y="53" width="10" height="10"/>
    <rect x="119" y="25" width="10" height="10"/>
    <rect x="135" y="107" width="10" height="10"/>
    <rect x="145" y="103" width="10" height="10"/>
    <rect x="195" y="79" width="10" height="10"/>
  </g>
</svg>
