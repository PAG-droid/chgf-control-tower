<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Journey, constructed pictogram direction">
  <rect width="256" height="256" fill="#F1EBE0"/>

  <!-- compass ticks, built on the same centre -->
  <g stroke="#16232B" stroke-width="8" stroke-linecap="butt">
    <line x1="128" y1="26" x2="128" y2="38"/>
    <line x1="128" y1="218" x2="128" y2="230"/>
    <line x1="26" y1="128" x2="38" y2="128"/>
    <line x1="218" y1="128" x2="230" y2="128"/>
  </g>

  <!-- the world -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#16232B" stroke-width="10"/>

  <!-- the route: an arc of a larger circle, tangent-constructed -->
  <path d="M74 182A118 118 0 0 1 186 80" fill="none" stroke="#16232B" stroke-width="10"
        stroke-linecap="round"/>

  <!-- origin, destination -->
  <circle cx="74" cy="182" r="13" fill="#16232B"/>
  <circle cx="186" cy="80" r="14" fill="#F1EBE0" stroke="#E4572E" stroke-width="10"/>
</svg>
